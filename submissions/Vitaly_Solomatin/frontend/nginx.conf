server {
    listen 80;
    root /usr/share/nginx/html;

    # Той самий origin, що й у dev (Vite): /api/* іде на backend без префікса /api.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s; # тестове повідомлення Telegram може тривати до ~35 с
    }

    location / {
        try_files $uri /index.html;
    }
}
