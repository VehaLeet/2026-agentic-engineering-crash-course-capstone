[project]
name = "oree-dam-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
