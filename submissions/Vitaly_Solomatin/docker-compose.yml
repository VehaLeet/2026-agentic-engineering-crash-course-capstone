services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
    ports:
      - "127.0.0.1:5432:5432"   # лише localhost: база не доступна з мережі
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d dam"]
      interval: 2s
      timeout: 2s
      retries: 15

  # API з планувальником. Міграції застосовуються на старті (див. backend/Dockerfile).
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Перекриває localhost-адресу з .env: у мережі compose база — це сервіс postgres.
      DATABASE_URL: postgresql+asyncpg://dam:dam@postgres:5432/dam
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # лише localhost: API без автентифікації

  # Зібраний веб-інтерфейс за nginx; /api проксується на backend.
  web:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"     # лише localhost

volumes:
  postgres_data:
