services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
    ports:
      - "127.0.0.1:5432:5432"   # лише localhost: база не доступна з мережі
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d dam"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
