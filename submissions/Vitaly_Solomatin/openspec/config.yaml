schema: spec-driven

context: |
  Проєкт: OREE DAM Monitor — внутрішній сервіс, що періодично завантажує офіційний
  квартальний CSV результатів РДН з OREE, парсить і зберігає ціни/обсяги в Postgres,
  сповіщає в Telegram про оновлення і має простий веб-інтерфейс (дані, фільтри,
  налаштування, ручне оновлення). Повний бриф із форматом джерела: docs/brief.md.

  Стек:
  - Backend: Python 3.12+, FastAPI, SQLAlchemy 2.x async, Alembic, Postgres 16, APScheduler.
  - Telegram: лише відправка через Bot API (httpx), без bot-фреймворків.
  - Frontend: React + TypeScript, Vite, ECharts, Zustand.
  - docker-compose, монорепо: backend/, frontend/.

  Конвенції:
  - Налаштування зберігаються в БД; секрети — лише в env.
  - Паралельні запуски збору заборонені (Postgres advisory lock).
  - Upsert за ключем (дата поставки, період); жодних дублікатів. Зона в ключ не входить —
    у даних OREE вона одна.
  - Період доби — порядковий номер 1..25 як у джерелі, без конвертації в годину доби.
    Дні зміни часу не потребують окремої логіки: кількість періодів задає сам CSV.
    Конвертація в мітку часу Europe/Kyiv — задача шару відображення.
  - Одиниця завантаження — квартал, а не доба; збір тягне квартал опорної дати і квартал
    наступної доби.
  - Детекція змін — дворівневий хеш: хеш файлу (ранній вихід) і хеш кожної доби постачання
    (перелік змінених діб). Числа як Decimal, не float.
  - Джерело даних ізольоване за інтерфейсом (fetcher + parser), щоб легко тестувати.
  - Тести: pytest; парсер покривається тестами на реальних прикладах CSV (fixtures),
    включно з добами на 23 і 25 періодів та порожнім кварталом.

rules:
  proposal:
    - Одна зміна = одна вертикальна фіча, яку можна переглянути за 15 хвилин.
    - Явно перелічувати, що НЕ входить у зміну.
  specs:
    - Сценарії у форматі GIVEN/WHEN/THEN, включно з помилковими випадками.
  design:
    - Описувати схему БД і контракти API, якщо зміна їх зачіпає.
  tasks:
    - Кожна задача закінчується тестом або перевірюваним результатом.
